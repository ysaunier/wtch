name: Lint Commits

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          pattern='^(feat|fix|docs|preset|refactor|test|chore|style)(\(.+\))?: .+'
          failed=0
          while IFS= read -r msg; do
            if ! echo "$msg" | grep -qP "$pattern"; then
              echo "::error::Invalid commit message: $msg"
              echo "  Expected format: <prefix>: <description>"
              echo "  Allowed prefixes: feat, fix, docs, preset, refactor, test, chore, style"
              failed=1
            fi
          done < <(git log --format='%s' origin/main..HEAD)
          if [ "$failed" = "1" ]; then
            echo ""
            echo "See CONTRIBUTING.md for commit message conventions."
            exit 1
          fi
          echo "All commit messages follow conventional commits format."
