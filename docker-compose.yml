services:
  dev:
    build: .
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/app/src-tauri/target
      - /app/node_modules
    ports:
      - "5173:5173"
    working_dir: /app
    command: sleep infinity

volumes:
  cargo-cache:
  cargo-git:
  target-cache:
