name: Campaign Monitor
type: adapter
adapter: urn:wtch:adapter:html
url: https://status.campaignmonitor.com
interval: 60s
adapter_config:
  mode: css
  selector: .status-list-component-status-text
  extract: class
  status_map:
    component-available: success
    component-unavailable: error
    component-degraded: warning
    component-maintenance: maintenance
    component-investigating: warning
