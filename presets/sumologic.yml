name: SumoLogic
type: adapter
adapter: urn:wtch:adapter:json
url: https://api.status.io/1.0/status/5ea1c7ba3f2f1604b93ca38e
interval: 60s
adapter_config:
  url_suffix: ''
  status_field: .result.status_overall.status_code
  status_map:
    '100': success
    '200': maintenance
    '300': warning
    '400': warning
    '500': error
    '600': error
